<!doctype html>
<!--
  公众号文章封面模板（1080×460，2.35:1）—— daily-100 系列视觉规范（v2 面板版）

  填充方法：复制本文件 → 字符串替换以下 token → 存到 tmp/illustrate/<slug>/cover.html
    {{L1_HTML}}   第一行：期号（mono 字体 + 紫色方块前缀），如「亲子英语打卡 01」
    {{L1_SIZE}}   第一行字号，默认 30px
    {{L2_HTML}}   第二行：核心词（大字号渐变），如「Ta-da!」「做产品」
    {{L2_SIZE}}   第二行字号，默认 100px；四字以上降到 80px
    {{L3_HTML}}   第三行：副题一行说清给读者什么，重点词包 <b>（青色）
    {{TEXT_LEFT}} 面板起点（文字区左缘），默认 480px；按背景主体位置调（主体在左就右移）
    {{BG_POS}}    背景裁切位置，如 center 52%

  设计规范见同目录 README.md。背景图 bg-cover.png 引用路径不要改。
  v2 变化：文字坐在右侧深色渐变面板上（面板自带左缘细紫线），任何背景图下都可读；
  竖排渐变条被 mono 期号行的方块前缀取代。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #cover {
    width: 1080px; height: 460px; position: relative; overflow: hidden;
    /* 照片底 + 右侧面板渐变：主体留在左边照片区，文字区整体压暗保证可读 */
    background:
      linear-gradient(90deg, rgba(6,9,20,0) 0%, rgba(6,9,20,.55) 30%, rgba(7,10,24,.92) 44%, rgba(8,11,26,.96) 100%),
      url('/templates/illustrate/bg-cover.png') {{BG_POS}} / cover no-repeat,
      #0b1020;
  }
  .text {
    position: absolute; left: {{TEXT_LEFT}}; top: 0; bottom: 0; right: 0;
    padding-left: 44px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    border-left: 1px solid rgba(168,155,255,.35);
  }
  .l1 {
    font-family: Consolas, 'Courier New', monospace;
    font-size: {{L1_SIZE}}; font-weight: 700; color: #b9aeff;
    letter-spacing: 8px; line-height: 1.15; white-space: nowrap;
    display: flex; align-items: center; gap: 14px;
  }
  .l1::before { content: ''; width: 12px; height: 12px; background: #a89bff; }
  .l2 {
    margin-top: 12px; font-size: {{L2_SIZE}}; font-weight: 800; line-height: 1.1;
    letter-spacing: 4px;
    background: linear-gradient(92deg, #ffffff 0%, #a89bff 55%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0,0,0,.55));
  }
  .l3 {
    margin-top: 18px; font-size: 26px; font-weight: 400; color: #c3cadd;
    letter-spacing: 3px; line-height: 1.6;
  }
  .l3 b { color: #86e8d8; font-weight: 600; }
</style>
</head>
<body>
<div id="cover">
  <div class="text">
    <div class="l1">{{L1_HTML}}</div>
    <div class="l2">{{L2_HTML}}</div>
    <div class="l3">{{L3_HTML}}</div>
  </div>
</div>
</body>
</html>
