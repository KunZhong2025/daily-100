<!doctype html>
<!--
  公众号内容卡片模板（1080×1440）—— daily-100 系列视觉规范

  填充方法：复制本文件 → 字符串替换以下 token → 存到 tmp/illustrate/<slug>/card-0N.html
    {{BADGE}}          徽章文字，如「03 · 质量关」（编号 = 文章内的真实阶段顺序）
    {{TITLE_HTML}}     大标题 HTML，可含 <br> 和一个 <span class="hl">渐变词</span>
    {{SUB}}            一句话副标题（来自文章原句，别改写）
    {{ROWS_HTML}}      2-4 个命令行块，照抄下方 .row 示例结构
    {{TERM_CMD}}       终端窗口里的命令，必须是文章正文出现过的命令
    {{TERM_LINES_HTML}} 终端输出行，<span class="ok">✓</span> 开头，内容要贴合该命令真实行为
    {{TIP_HTML}}       底部金句，一行为宜，重点词包 <b>
    {{BG_POS}}         背景裁切位置，多张卡片轮换取值避免雷同（如 center 62% / center 40%）

  设计规范见同目录 README.md。背景图 bg-card.png 引用路径不要改。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 色彩 token：violet=结构 teal=命令 green=仅终端内。别加第三种强调色 */
  :root {
    --midnight: #0b1020; --ink: #f2f4fb; --body: #aab2c5; --faint: #7d869b;
    --violet: #a89bff; --violet-deep: #8f7bff; --teal: #86e8d8; --ok: #85ec8b;
    --line: rgba(255,255,255,.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #card {
    width: 1080px; height: 1440px; padding: 60px 64px;
    display: flex; flex-direction: column;
    background:
      linear-gradient(180deg, rgba(6,9,20,.82) 0%, rgba(6,9,20,.60) 40%, rgba(6,9,20,.46) 66%, rgba(6,9,20,.78) 100%),
      url('/templates/illustrate/bg-card.png') {{BG_POS}} / cover no-repeat,
      var(--midnight);
    position: relative; overflow: hidden;
  }
  .badge {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 26px; border: 1px solid rgba(160,148,255,.65); border-radius: 999px;
    background: rgba(12,12,32,.62); color: var(--violet); font-size: 26px; letter-spacing: 2px;
  }
  .title {
    margin-top: 40px; font-size: 84px; font-weight: 800; line-height: 1.22; color: var(--ink);
    text-shadow: 0 2px 28px rgba(0,0,0,.65);
  }
  .title .hl {
    background: linear-gradient(92deg, #a89bff 0%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 22px; font-size: 30px; color: #b6bdd0; letter-spacing: 1px;
         text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  .divider { margin-top: 26px; width: 56px; height: 7px; border-radius: 4px;
             background: linear-gradient(90deg, var(--violet-deep), #5ad0c0); }
  .rows { margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }
  .row {
    display: flex; align-items: center; gap: 24px;
    padding: 26px 30px; border-radius: 18px;
    background: rgba(9,13,26,.58); border: 1px solid var(--line);
  }
  .num {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124,108,246,.20); border: 1px solid rgba(160,148,255,.6);
    color: var(--violet); font-size: 26px; font-weight: 700;
  }
  .icon { flex: none; display: flex; }
  .cmd {
    display: inline-block; padding: 5px 16px; border-radius: 10px;
    font-family: Consolas, 'Courier New', monospace; font-size: 30px; font-weight: 600;
    color: var(--teal); background: rgba(10,40,44,.66); border: 1px solid rgba(94,180,168,.5);
  }
  .row .name { font-size: 30px; font-weight: 700; color: #edf0f8; }
  .row .desc { margin-top: 8px; font-size: 24px; color: var(--body); line-height: 1.5; }
  /* 签名元素：每张卡片必带的 Claude Code 终端窗口，内容必须是正文里真实的命令 */
  .term {
    margin-top: 34px; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.15); background: rgba(7,11,22,.88);
  }
  .term .bar {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .term .bar span { margin-left: 10px; font-size: 20px; color: var(--faint); letter-spacing: 1px; }
  .term pre {
    padding: 26px 30px; font-family: Consolas, 'Courier New', monospace;
    font-size: 25px; line-height: 1.85; color: #d3dbef;
  }
  .term .ok { color: var(--ok); }
  .tip {
    margin-top: auto; display: flex; align-items: center; gap: 20px;
    padding: 26px 30px; border-radius: 16px;
    background: rgba(22,17,52,.72); border: 1px solid rgba(150,136,255,.55);
  }
  .tip .t { font-size: 29px; font-weight: 600; color: #e6e9f5; line-height: 1.55; }
  .tip .t b { color: var(--violet); }
</style>
</head>
<body>
<div id="card">
  <div class="badge">{{BADGE}}</div>

  <div class="title">{{TITLE_HTML}}</div>
  <div class="sub">{{SUB}}</div>
  <div class="divider"></div>

  <div class="rows">
{{ROWS_HTML}}
  </div>

  <div class="term">
    <div class="bar">
      <div class="dot" style="background:#ff5f57"></div>
      <div class="dot" style="background:#febc2e"></div>
      <div class="dot" style="background:#28c840"></div>
      <span>Claude Code</span>
    </div>
    <pre>&gt; {{TERM_CMD}}
{{TERM_LINES_HTML}}</pre>
  </div>

  <div class="tip">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a89bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6.5 6.5 0 0 1 4 11.6c-.8.6-1.3 1.4-1.3 2.4h-5.4c0-1-.5-1.8-1.3-2.4A6.5 6.5 0 0 1 12 3z"/></svg>
    <div class="t">{{TIP_HTML}}</div>
  </div>
</div>
</body>
</html>
