<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --midnight: #0b1020; --ink: #f2f4fb; --body: #aab2c5; --faint: #7d869b;
    --violet: #a89bff; --violet-deep: #8f7bff; --teal: #86e8d8; --ok: #85ec8b;
    --line: rgba(255,255,255,.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #card {
    width: 1080px; height: 1440px; padding: 60px 64px 0;
    display: flex; flex-direction: column;
    background:
      linear-gradient(180deg, rgba(6,9,20,.82) 0%, rgba(6,9,20,.60) 40%, rgba(6,9,20,.46) 66%, rgba(6,9,20,.78) 100%),
      url('/templates/illustrate/bg-card.png') center 62% / cover no-repeat,
      var(--midnight);
    position: relative; overflow: hidden;
  }
  .badge {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 26px; border: 1px solid rgba(160,148,255,.65); border-radius: 999px;
    background: rgba(12,12,32,.62); color: var(--violet); font-size: 26px; letter-spacing: 2px;
  }
  .title {
    margin-top: 34px; font-size: 92px; font-weight: 800; line-height: 1.2; color: var(--ink);
    text-shadow: 0 2px 28px rgba(0,0,0,.65);
  }
  .title .hl {
    background: linear-gradient(92deg, #a89bff 0%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 20px; font-size: 30px; color: #b6bdd0; letter-spacing: 1px;
         line-height: 1.7; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  .divider { margin-top: 26px; width: 56px; height: 7px; border-radius: 4px;
             background: linear-gradient(90deg, var(--violet-deep), #5ad0c0); }
  .rows { margin-top: 36px; display: flex; flex-direction: column; gap: 20px; }
  .row {
    display: flex; align-items: center; gap: 24px;
    padding: 24px 28px; border-radius: 16px;
    background: rgba(9,13,26,.62); border: 1px solid var(--line);
  }
  .num {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124,108,246,.20); border: 1px solid rgba(160,148,255,.6);
    color: var(--violet); font-size: 26px; font-weight: 700;
  }
  .cmd {
    display: inline-block; padding: 5px 16px; border-radius: 10px;
    font-family: Consolas, 'Courier New', monospace; font-size: 31px; font-weight: 600;
    color: var(--teal); background: rgba(10,40,44,.70); border: 1px solid rgba(94,180,168,.5);
  }
  .row .name { font-size: 30px; font-weight: 700; color: #edf0f8; }
  .row .desc { margin-top: 8px; font-size: 24px; color: var(--body); line-height: 1.5; }
  .term {
    margin-top: 30px; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.15); background: rgba(7,11,22,.88);
  }
  .term .bar {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .term .bar span { margin-left: 10px; font-size: 20px; color: var(--faint); letter-spacing: 1px; }
  .term pre {
    padding: 24px 30px; font-family: Consolas, 'Courier New', monospace;
    font-size: 25px; line-height: 1.75; color: #d3dbef;
  }
  .term .ok { color: var(--ok); }
  .tip {
    margin: auto -64px 0; padding: 30px 64px 34px;
    background: linear-gradient(90deg, rgba(22,17,52,.55) 0%, rgba(22,17,52,.85) 45%, rgba(22,17,52,.55) 100%);
    border-top: 1px solid rgba(150,136,255,.5);
    display: flex; align-items: center; gap: 20px;
  }
  .tip svg { flex: none; }
  .tip .t { font-size: 30px; font-weight: 600; color: #e6e9f5; line-height: 1.55; }
  .tip .t b { color: var(--violet); }
</style>
</head>
<body>
<div id="card">
  <div class="badge">01 · 打卡素材</div>

  <div class="title">堆沙堡的<br><span class="hl">7 句话</span></div>
  <div class="sub">把美国家庭里家长对娃说的话直接搬过来，在真实场景里用</div>
  <div class="divider"></div>

  <div class="rows">
    <div class="row">
      <div class="cmd">Do you want to build a sandcastle?</div>
      <div><div class="name">想不想堆一个沙堡？</div></div>
    </div>
    <div class="row">
      <div class="cmd">Sweetie, let's make a sandcastle.</div>
      <div><div class="name">甜心，我们来堆个沙堡吧。</div></div>
    </div>
    <div class="row">
      <div class="cmd">Hey, presto, a sandcastle.</div>
      <div><div class="name">嘿！变！一个沙堡。</div><div class="desc">唯一翻车的一句</div></div>
    </div>
  </div>

  <div class="term">
    <div class="bar">
      <div class="dot" style="background:#ff5f57"></div>
      <div class="dot" style="background:#febc2e"></div>
      <div class="dot" style="background:#28c840"></div>
      <span>Claude Code</span>
    </div>
    <pre>&gt; 发给 Claude 核查了一遍语法和地道程度
<span class="ok">✓</span> 7 句里 6 句都没问题
<span class="ok">✓</span> make a sandcastle 完全地道</pre>
  </div>

  <div class="tip">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a89bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6.5 6.5 0 0 1 4 11.6c-.8.6-1.3 1.4-1.3 2.4h-5.4c0-1-.5-1.8-1.3-2.4A6.5 6.5 0 0 1 12 3z"/></svg>
    <div class="t">唯一翻车的是收尾那句 <b>Hey presto</b></div>
  </div>
</div>
</body>
</html>
