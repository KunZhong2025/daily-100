<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #cover {
    width: 1080px; height: 460px; position: relative; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(6,9,20,.38) 0%, rgba(6,9,20,0) 35%, rgba(6,9,20,.05) 55%, rgba(6,9,20,.88) 100%),
      url('/templates/illustrate/bg-cover.png') center 52% / cover no-repeat,
      #0b1020;
  }
  .text {
    position: absolute; left: 64px; bottom: 48px; right: 64px;
    display: flex; align-items: flex-end; gap: 44px;
  }
  .l2 {
    flex: none; font-size: 118px; font-weight: 800; line-height: .96;
    letter-spacing: 2px;
    background: linear-gradient(92deg, #ffffff 0%, #a89bff 55%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0,0,0,.6));
  }
  .right { display: flex; flex-direction: column; align-items: flex-start; padding-bottom: 10px; }
  .l1 {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 28px; font-weight: 700; color: #b9aeff;
    letter-spacing: 7px; white-space: nowrap;
    display: flex; align-items: center; gap: 14px;
  }
  .l1::before { content: ''; width: 34px; height: 5px; border-radius: 3px;
                background: linear-gradient(90deg, #8f7bff, #5ad0c0); }
  .l3 {
    margin-top: 14px; font-size: 26px; font-weight: 400; color: #c3cadd;
    letter-spacing: 3px; line-height: 1.6; text-shadow: 0 1px 12px rgba(0,0,0,.65);
  }
  .l3 b { color: #86e8d8; font-weight: 600; }
</style>
</head>
<body>
<div id="cover">
  <div class="text">
    <div class="l2">Ta-da!</div>
    <div class="right">
      <div class="l1">亲子英语打卡 01</div>
      <div class="l3">7 句堆沙堡口语，一句<b>英式咒语</b>翻了车</div>
    </div>
  </div>
</div>
</body>
</html>
