<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #cover {
    width: 1080px; height: 460px; position: relative; overflow: hidden;
    background:
      linear-gradient(90deg, rgba(6,9,20,0) 0%, rgba(6,9,20,.55) 30%, rgba(7,10,24,.92) 44%, rgba(8,11,26,.96) 100%),
      url('/templates/illustrate/bg-cover.png') center 52% / cover no-repeat,
      #0b1020;
  }
  .text {
    position: absolute; left: 480px; top: 0; bottom: 0; right: 0;
    padding-left: 44px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    border-left: 1px solid rgba(168,155,255,.35);
  }
  .l1 {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 30px; font-weight: 700; color: #b9aeff;
    letter-spacing: 8px; line-height: 1.15; white-space: nowrap;
    display: flex; align-items: center; gap: 14px;
  }
  .l1::before { content: ''; width: 12px; height: 12px; background: #a89bff; }
  .l2 {
    margin-top: 12px; font-size: 100px; font-weight: 800; line-height: 1.1;
    letter-spacing: 4px;
    background: linear-gradient(92deg, #ffffff 0%, #a89bff 55%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0,0,0,.55));
  }
  .l3 {
    margin-top: 18px; font-size: 26px; font-weight: 400; color: #c3cadd;
    letter-spacing: 3px; line-height: 1.6;
  }
  .l3 b { color: #86e8d8; font-weight: 600; }
</style>
</head>
<body>
<div id="cover">
  <div class="text">
    <div class="l1">亲子英语打卡 01</div>
    <div class="l2">Ta-da!</div>
    <div class="l3">7 句堆沙堡口语，一句<b>英式咒语</b>翻了车</div>
  </div>
</div>
</body>
</html>
