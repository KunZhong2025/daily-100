<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  #cover {
    width: 1080px; height: 460px; position: relative; overflow: hidden;
    background:
      linear-gradient(90deg, rgba(6,9,20,.10) 0%, rgba(6,9,20,.30) 38%, rgba(6,9,20,.64) 60%, rgba(6,9,20,.80) 100%),
      linear-gradient(180deg, rgba(6,9,20,.30) 0%, rgba(6,9,20,0) 30%, rgba(6,9,20,0) 70%, rgba(6,9,20,.45) 100%),
      url('/templates/illustrate/bg-cover.png') center 52% / cover no-repeat,
      #0b1020;
  }
  .text {
    position: absolute; left: 430px; top: 50%; transform: translateY(-50%);
    width: 600px;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .bar { width: 64px; height: 6px; border-radius: 3px;
         background: linear-gradient(90deg, #8f7bff, #5ad0c0); }
  .l1 {
    margin-top: 26px; font-family: Consolas, 'Courier New', monospace;
    font-size: 34px; font-weight: 700; color: #b9aeff;
    letter-spacing: 8px; line-height: 1.15; white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0,0,0,.7);
  }
  .l2 {
    margin-top: 10px; font-size: 100px; font-weight: 800; line-height: 1.1;
    letter-spacing: 4px;
    background: linear-gradient(92deg, #ffffff 0%, #a89bff 55%, #6fe3d2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0,0,0,.55));
  }
  .l3 {
    margin-top: 20px; font-size: 27px; font-weight: 400; color: #c3cadd;
    letter-spacing: 4px; text-shadow: 0 1px 12px rgba(0,0,0,.65);
  }
  .l3 b { color: #86e8d8; font-weight: 600; }
</style>
</head>
<body>
<div id="cover">
  <div class="text">
    <div class="bar"></div>
    <div class="l1">亲子英语打卡 01</div>
    <div class="l2">Ta-da!</div>
    <div class="l3">7 句堆沙堡口语，一句<b>英式咒语</b>翻了车</div>
  </div>
</div>
</body>
</html>
